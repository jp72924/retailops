name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  django:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      # Report every version's result rather than cancelling siblings on the
      # first failure — a version-specific break is exactly what this catches.
      fail-fast: false
      matrix:
        # Floor 3.10: mcp and psycopg both require it.
        # Ceiling 3.12: Django 4.2 LTS supports up to 3.12, and requirements.txt
        # pins Django <5.0. Raise this only when that pin moves.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Django checks
        run: python manage.py check

      - name: Migration check
        run: python manage.py makemigrations --check --dry-run

      - name: Test
        run: python manage.py test
